name: Deploy site with fresh satellite data

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours (CelesTrak updates every 2)
  workflow_dispatch:

permissions:
  contents: write   # to push daily snapshots to the "history" branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download orbital data from CelesTrak
        env:
          SITE_URL: https://spocktology.github.io/satellite-flare-check
        run: python scripts/fetch_tle.py

      # Once per UTC day, save a compressed snapshot to the "history" branch.
      # The app reads it from raw.githubusercontent.com for past sightings.
      - name: Archive today's snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" history >/dev/null; then
            git clone --quiet --depth 1 --branch history --single-branch "$REMOTE" ../history
          else
            git init --quiet -b history ../history
            git -C ../history remote add origin "$REMOTE"
          fi
          python scripts/archive_snapshot.py data ../history
          git -C ../history add -A
          if git -C ../history diff --cached --quiet; then echo "no new snapshot"; exit 0; fi
          git -C ../history commit --quiet -m "Snapshot $(date -u +%F)"
          git -C ../history push --quiet origin history

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
