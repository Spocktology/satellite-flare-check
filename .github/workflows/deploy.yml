name: Deploy site with fresh satellite data

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours (CelesTrak updates every 2)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download orbital data from CelesTrak
        env:
          SITE_URL: https://spocktology.github.io/satellite-flare-check
        run: python scripts/fetch_tle.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
